<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Ôn Từ Vựng Tiếng Trung</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font giao diện và font chữ Hán dễ đọc ở kích thước lớn -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div>
        <p class="eyebrow">Chinese Vocabulary Lab</p>
        <h1>Nối từ tiếng Trung</h1>
      </div>

      <div class="header-actions">
        <button class="btn-toggle-mode" id="btn-toggle-mode">🎮 Làm Quiz</button>
        <button class="btn-primary small" id="typing-mode-btn">⌨️ Gõ từ</button>
        <button class="btn-primary small" id="listening-mode-btn">🔊 Nghe</button>
      </div>
    </header>

    <div class="study-panel">
      <div class="panel-header">
        <span>Chế độ ôn tập</span>
        <div class="panel-actions">
          <div class="stats">
            <span>Đã chọn: <strong id="selected-word-count">0</strong> từ</span>
          </div>
          <button class="btn-shuffle" id="btn-shuffle" type="button" title="Xáo trộn bộ từ hiện tại">🔀 Xáo trộn</button>
        </div>
      </div>

      <div class="filter-stack">
        <label for="data-source">Bộ từ vựng</label>
        <select id="data-source">
          <option value="all">Tất cả bộ từ</option>
        </select>

        <label for="study-mode">Ôn theo</label>
        <select id="study-mode">
          <option value="all">Ôn từ vựng</option>
          <option value="topic">Ôn theo chủ đề</option>
          <option value="noun">Ôn theo danh từ</option>
          <option value="verb">Ôn theo động từ</option>
          <option value="adjective">Ôn theo tính từ</option>
          <option value="phrase">Ôn theo cụm từ</option>
          <option value="number">Ôn theo số từ</option>
          <option value="pronoun">Ôn theo đại từ</option>
        </select>
        <select id="topic-filter" class="hidden">
          <option value="all">Tất cả chủ đề</option>
        </select>
      </div>
    </div>

    <div id="matching-screen" class="screen hidden">
      <div class="matching-box">
        <div class="matching-header">
          <div>
            <p class="matching-kicker">Nối đúng bộ ba</p>
            <h2 id="matching-progress">0 / 6 cặp đúng</h2>
          </div>
          <p id="matching-feedback" class="matching-feedback" aria-live="polite"></p>
        </div>

        <div class="matching-grid">
          <section class="matching-column">
            <h3>Tiếng Trung</h3>
            <div id="matching-chinese" class="matching-options"></div>
          </section>
          <section class="matching-column">
            <h3>Pinyin</h3>
            <div id="matching-pinyin" class="matching-options"></div>
          </section>
          <section class="matching-column">
            <h3>Tiếng Việt</h3>
            <div id="matching-vietnamese" class="matching-options"></div>
          </section>
        </div>

        <button class="btn btn-primary btn-full" id="btn-next-matching" type="button">Bộ từ tiếp theo</button>
      </div>
    </div>

    <div id="quiz-screen" class="screen">
      <div class="quiz-box">
        <div class="quiz-header">
          <span>Điểm: <strong id="quiz-score">0</strong></span>
          <span id="quiz-progress">Câu 1/5</span>
        </div>
        <h3 class="quiz-question-word" id="quiz-word">你好</h3>
        <p class="quiz-question-type" id="quiz-word-type">phrase</p>
        <p class="quiz-phonetic" id="quiz-phonetic">nǐ hǎo</p>
        <p class="quiz-example" id="quiz-example">你好，很高兴认识你。</p>
        <button class="btn btn-primary btn-full" id="btn-quiz-speak" type="button">🔊 Phát âm</button>
        
        <div class="quiz-options" id="quiz-options">
        </div>

        <button class="btn btn-primary btn-full" id="btn-next-quiz">Câu tiếp theo ➡</button>
      </div>
    </div>

    <div id="listening-screen" class="screen hidden">
      <div class="quiz-box">
        <div class="quiz-header">
          <span>Điểm: <strong id="listening-score">0</strong></span>
          <span id="listening-progress">Câu 1/5</span>
        </div>
        <p class="typing-label">Nghe tiếng Trung và chọn nghĩa</p>
        <div class="listening-icon" aria-hidden="true">🔊</div>
        <button class="btn btn-primary btn-full" id="btn-replay-listening" type="button">🔊 Phát lại</button>
        <div class="quiz-options" id="listening-options"></div>
        <button class="btn btn-primary btn-full" id="btn-next-listening" type="button">Câu tiếp theo ➡</button>
      </div>
    </div>

    <div id="typing-screen" class="screen hidden">
      <div class="quiz-box">
        <div class="quiz-header">
          <span>Điểm: <strong id="typing-score">0</strong></span>
          <span id="typing-progress">Câu 1/5</span>
        </div>

        <label class="typing-label" for="typing-direction">Hướng luyện tập</label>
        <select id="typing-direction" class="typing-direction">
          <option value="chinese-to-vietnamese">Hiển thị tiếng Trung → Gõ tiếng Việt</option>
          <option value="vietnamese-to-chinese">Hiển thị tiếng Việt → Gõ chữ Hán</option>
        </select>

        <p class="typing-label" id="typing-prompt">Từ tiếng Trung</p>
        <h3 class="quiz-question-word" id="typing-word">你好</h3>
        <p class="quiz-phonetic" id="typing-phonetic">nǐ hǎo</p>

        <label class="typing-label" for="typing-input">Gõ nghĩa tiếng Việt</label>
        <input id="typing-input" type="text" class="typing-input" placeholder="Nhập nghĩa tiếng Việt..." autocomplete="off" />

        <button class="btn btn-primary btn-full" id="btn-check-typing">Kiểm tra</button>
        <p id="typing-feedback" class="typing-feedback"></p>
      </div>
    </div>

  </div>


  <script src="app.js"></script>
</body>
</html>
